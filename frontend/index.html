<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CineAI</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:       #080a0e;
    --surface:  #0f1218;
    --card:     #141820;
    --border:   #1e2530;
    --gold:     #e8b84b;
    --gold2:    #f5d07a;
    --red:      #c0392b;
    --text:     #e8e4dc;
    --muted:    #6b7280;
    --dim:      #3a4150;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Grain overlay ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: .4;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.5rem 3rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(8,10,14,.92);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: .15em;
    color: var(--gold);
    text-shadow: 0 0 30px rgba(232,184,75,.3);
  }

  .logo span { color: var(--text); }

  .stats-bar {
    display: flex;
    gap: 2rem;
    font-size: .72rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stats-bar strong { color: var(--gold); font-weight: 500; }

  /* ── Main layout ── */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 3rem 2rem;
  }

  /* ── Hero ── */
  .hero {
    text-align: center;
    margin-bottom: 4rem;
    animation: fadeUp .8s ease both;
  }

  .hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 8vw, 6rem);
    letter-spacing: .1em;
    line-height: 1;
    background: linear-gradient(135deg, var(--gold2) 0%, var(--gold) 50%, #b8860b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: .75rem;
  }

  .hero p {
    color: var(--muted);
    font-size: 1rem;
    letter-spacing: .05em;
  }

  /* ── Mode tabs ── */
  .mode-tabs {
    display: flex;
    justify-content: center;
    gap: .5rem;
    margin-bottom: 2.5rem;
    animation: fadeUp .8s .15s ease both;
  }

  .tab {
    padding: .6rem 1.4rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: .8rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all .2s;
  }

  .tab:hover { border-color: var(--dim); color: var(--text); }

  .tab.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #000;
    font-weight: 500;
  }

  /* ── Search panel ── */
  .panel {
    display: none;
    animation: fadeUp .4s ease both;
  }
  .panel.active { display: block; }

  .search-row {
    display: flex;
    gap: 1rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: .4rem;
    flex: 1;
    min-width: 200px;
  }

  label {
    font-size: .72rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: .95rem;
    padding: .75rem 1rem;
    border-radius: 3px;
    outline: none;
    transition: border-color .2s;
  }

  input:focus { border-color: var(--gold); }
  input::placeholder { color: var(--dim); }

  /* Autocomplete */
  .autocomplete-wrap { position: relative; }

  .autocomplete-list {
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-top: none;
    max-height: 220px;
    overflow-y: auto;
    z-index: 200;
    border-radius: 0 0 3px 3px;
  }

  .autocomplete-list div {
    padding: .65rem 1rem;
    cursor: pointer;
    font-size: .88rem;
    border-bottom: 1px solid var(--border);
    transition: background .15s;
  }

  .autocomplete-list div:hover { background: var(--surface); color: var(--gold); }
  .autocomplete-list div:last-child { border-bottom: none; }

  .btn {
    padding: .75rem 2rem;
    background: var(--gold);
    border: none;
    color: #000;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: .1em;
    cursor: pointer;
    border-radius: 3px;
    align-self: flex-end;
    transition: background .2s, transform .1s;
    white-space: nowrap;
  }

  .btn:hover { background: var(--gold2); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  /* ── Results ── */
  .results-header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .results-header h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: .1em;
    color: var(--text);
  }

  .results-header span {
    font-size: .75rem;
    color: var(--muted);
    letter-spacing: .05em;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.2rem;
    transition: border-color .2s, transform .2s;
    animation: fadeUp .4s ease both;
    cursor: default;
  }

  .card:hover {
    border-color: var(--gold);
    transform: translateY(-3px);
  }

  .card-rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: .9rem;
    color: var(--dim);
    letter-spacing: .1em;
    margin-bottom: .3rem;
  }

  .card-title {
    font-size: .95rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: .6rem;
  }

  .card-genres {
    display: flex;
    flex-wrap: wrap;
    gap: .3rem;
    margin-bottom: .8rem;
  }

  .genre-tag {
    font-size: .65rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: .2rem .5rem;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 2px;
  }

  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: .78rem;
    color: var(--muted);
  }

  .rating {
    display: flex;
    align-items: center;
    gap: .3rem;
    color: var(--gold);
    font-weight: 500;
  }

  .score-bar {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    margin-top: .8rem;
    overflow: hidden;
  }

  .score-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold2));
    border-radius: 2px;
    transition: width .6s ease;
  }

  /* ── Loading ── */
  .loading {
    display: none;
    text-align: center;
    padding: 3rem;
    color: var(--muted);
    font-size: .85rem;
    letter-spacing: .1em;
    text-transform: uppercase;
  }

  .loading.show { display: block; }

  .spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 1rem;
  }

  /* ── Error ── */
  .error-msg {
    display: none;
    background: rgba(192,57,43,.1);
    border: 1px solid rgba(192,57,43,.3);
    color: #e74c3c;
    padding: 1rem 1.5rem;
    border-radius: 3px;
    font-size: .88rem;
    margin-bottom: 1.5rem;
  }

  .error-msg.show { display: block; }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ── Stagger cards ── */
  .card:nth-child(1)  { animation-delay: .05s; }
  .card:nth-child(2)  { animation-delay: .10s; }
  .card:nth-child(3)  { animation-delay: .15s; }
  .card:nth-child(4)  { animation-delay: .20s; }
  .card:nth-child(5)  { animation-delay: .25s; }
  .card:nth-child(6)  { animation-delay: .30s; }
  .card:nth-child(7)  { animation-delay: .35s; }
  .card:nth-child(8)  { animation-delay: .40s; }
  .card:nth-child(9)  { animation-delay: .45s; }
  .card:nth-child(10) { animation-delay: .50s; }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 2rem;
    color: var(--dim);
    font-size: .72rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    border-top: 1px solid var(--border);
    margin-top: 4rem;
  }

  @media (max-width: 600px) {
    header { padding: 1rem 1.2rem; }
    .stats-bar { display: none; }
    main { padding: 2rem 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Cine<span>AI</span></div>
  <div class="stats-bar" id="statsBar">
    <div>Filmes: <strong id="statMovies">–</strong></div>
    <div>Ratings: <strong id="statRatings">–</strong></div>
    <div>Usuários: <strong id="statUsers">–</strong></div>
  </div>
</header>

<main>
  <section class="hero">
    <h1>Recomendação Inteligente</h1>
    <p>MovieLens · Content-Based · Collaborative Filtering · Hybrid</p>
  </section>

  <!-- Mode tabs -->
  <div class="mode-tabs">
    <button class="tab active" onclick="switchMode('content')">Content-Based</button>
    <button class="tab" onclick="switchMode('collaborative')">Collaborative</button>
    <button class="tab" onclick="switchMode('hybrid')">Hybrid</button>
  </div>

  <!-- CONTENT-BASED -->
  <div class="panel active" id="panel-content">
    <div class="search-row">
      <div class="field autocomplete-wrap">
        <label>Título do filme</label>
        <input type="text" id="cb-title" placeholder="Ex: Toy Story (1995)" autocomplete="off"
               oninput="handleAutocomplete(this, 'cb-ac')"/>
        <div class="autocomplete-list" id="cb-ac"></div>
      </div>
      <div class="field" style="max-width:100px">
        <label>Qtd.</label>
        <input type="number" id="cb-n" value="10" min="5" max="30"/>
      </div>
      <button class="btn" onclick="runContent()">Recomendar</button>
    </div>
  </div>

  <!-- COLLABORATIVE -->
  <div class="panel" id="panel-collaborative">
    <div class="search-row">
      <div class="field" style="max-width:200px">
        <label>User ID</label>
        <input type="number" id="cf-uid" placeholder="Ex: 1" min="1"/>
      </div>
      <div class="field" style="max-width:100px">
        <label>Qtd.</label>
        <input type="number" id="cf-n" value="10" min="5" max="30"/>
      </div>
      <button class="btn" onclick="runCollaborative()">Recomendar</button>
    </div>
  </div>

  <!-- HYBRID -->
  <div class="panel" id="panel-hybrid">
    <div class="search-row">
      <div class="field autocomplete-wrap">
        <label>Título do filme</label>
        <input type="text" id="hy-title" placeholder="Ex: Matrix (1999)" autocomplete="off"
               oninput="handleAutocomplete(this, 'hy-ac')"/>
        <div class="autocomplete-list" id="hy-ac"></div>
      </div>
      <div class="field" style="max-width:200px">
        <label>User ID</label>
        <input type="number" id="hy-uid" placeholder="Ex: 1" min="1"/>
      </div>
      <div class="field" style="max-width:100px">
        <label>Qtd.</label>
        <input type="number" id="hy-n" value="10" min="5" max="30"/>
      </div>
      <button class="btn" onclick="runHybrid()">Recomendar</button>
    </div>
  </div>

  <!-- Feedback -->
  <div class="error-msg" id="errorMsg"></div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    Processando recomendações…
  </div>

  <!-- Results -->
  <div id="resultsSection" style="display:none">
    <div class="results-header">
      <h2 id="resultsTitle">Resultados</h2>
      <span id="resultsSubtitle"></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</main>

<footer>CineAI — Sistema de Recomendação · MovieLens Dataset · FastAPI + TF-IDF + SVD</footer>

<script>
const API = 'http://localhost:8000';
let acTimeout = null;
let currentMode = 'content';
let cachedMovies = []; // Browser cache for instant autocomplete

// Normalize string for local search
function normalizeStr(str) {
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

// ── Cache Load ───────────────────────────────────────────────────────────
async function loadMovieCache() {
  try {
    const r = await fetch(`${API}/movies/all`);
    if (r.ok) {
      cachedMovies = await r.json();
      console.log(`Carregados ${cachedMovies.length} filmes no cache do navegador.`);
    }
  } catch(e) {
    console.warn("Falha ao carregar cache de filmes. O servidor ainda pode estar iniciando.", e);
    setTimeout(loadMovieCache, 5000); // Retry later if server isn't ready
  }
}
loadMovieCache();

// ── Stats ────────────────────────────────────────────────────────────────
async function loadStats() {
  try {
    const r = await fetch(`${API}/stats`);
    const d = await r.json();
    document.getElementById('statMovies').textContent  = d.totalMovies.toLocaleString('pt-BR');
    document.getElementById('statRatings').textContent = d.totalRatings.toLocaleString('pt-BR');
    document.getElementById('statUsers').textContent   = d.totalUsers.toLocaleString('pt-BR');
  } catch {
    setTimeout(loadStats, 5000); // Retry stats if server not ready
  }
}
loadStats();

// ── Mode switch ──────────────────────────────────────────────────────────
function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['content','collaborative','hybrid'][i] === mode);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${mode}`).classList.add('active');
  hideResults();
}

// ── Autocomplete ─────────────────────────────────────────────────────────
async function handleAutocomplete(input, listId) {
  clearTimeout(acTimeout);
  const list = document.getElementById(listId);
  if (input.value.length < 2) { list.innerHTML = ''; return; }

  acTimeout = setTimeout(() => {
    if (cachedMovies.length === 0) {
      list.innerHTML = '<div style="color:var(--dim)">Carregando banco de dados...</div>';
      return;
    }
    
    const query = normalizeStr(input.value);
    
    // Instant local filter (cachedMovies is already pre-sorted by popularity!)
    const matches = [];
    for (let i = 0; i < cachedMovies.length; i++) {
      if (cachedMovies[i].norm.includes(query)) {
        matches.push(cachedMovies[i]);
        if (matches.length >= 8) break; // Limit to 8 results
      }
    }
    
    if (matches.length === 0) {
      list.innerHTML = '<div style="color:var(--dim)">Nenhum filme encontrado</div>';
      return;
    }

    list.innerHTML = matches.map(m =>
      `<div onclick="selectTitle('${m.title.replace(/'/g,"\\'")}', '${input.id}', '${listId}')">${m.title}</div>`
    ).join('');
  }, 50); // almost instant
}

function selectTitle(title, inputId, listId) {
  document.getElementById(inputId).value = title;
  document.getElementById(listId).innerHTML = '';
}

document.addEventListener('click', e => {
  document.querySelectorAll('.autocomplete-list').forEach(l => {
    if (!l.contains(e.target)) l.innerHTML = '';
  });
});

// ── Render ───────────────────────────────────────────────────────────────
function renderResults(items, title, subtitle) {
  document.getElementById('resultsTitle').textContent   = title;
  document.getElementById('resultsSubtitle').textContent = subtitle;

  const maxScore = Math.max(...items.map(i => i.score || 0));

  document.getElementById('grid').innerHTML = items.map((m, idx) => `
    <div class="card">
      <div class="card-rank">#${String(idx+1).padStart(2,'0')}</div>
      <div class="card-title">${m.title}</div>
      <div class="card-genres">
        ${(m.genres || []).slice(0,3).map(g => `<span class="genre-tag">${g}</span>`).join('')}
      </div>
      <div class="card-meta">
        <span class="rating">★ ${m.avgRating > 0 ? m.avgRating.toFixed(1) : '—'}</span>
        <span>${m.numRatings > 0 ? m.numRatings.toLocaleString('pt-BR') + ' avaliações' : ''}</span>
      </div>
      ${m.score !== undefined ? `
      <div class="score-bar">
        <div class="score-fill" style="width:${Math.round((m.score/maxScore)*100)}%"></div>
      </div>` : ''}
    </div>
  `).join('');

  document.getElementById('resultsSection').style.display = 'block';
}

// ── UI helpers ───────────────────────────────────────────────────────────
function showLoading()  { document.getElementById('loading').classList.add('show'); hideResults(); hideError(); }
function hideLoading()  { document.getElementById('loading').classList.remove('show'); }
function hideResults()  { document.getElementById('resultsSection').style.display = 'none'; }
function showError(msg) { const el = document.getElementById('errorMsg'); el.textContent = msg; el.classList.add('show'); }
function hideError()    { document.getElementById('errorMsg').classList.remove('show'); }

// ── Actions ──────────────────────────────────────────────────────────────

// Strip the year e.g. " (1995)" so it doesn't break pandas regex search in the backend
function cleanTitleForAPI(title) {
  return title.replace(/\s*\(\d{4}\)\s*$/, '').trim();
}

async function runContent() {
  const title = document.getElementById('cb-title').value.trim();
  const n     = document.getElementById('cb-n').value;
  if (!title) { showError('Digite o nome de um filme.'); return; }

  const searchTitle = cleanTitleForAPI(title);

  showLoading();
  try {
    const r = await fetch(`${API}/recommend/content?title=${encodeURIComponent(searchTitle)}&n=${n}`);
    if (!r.ok) { const e = await r.json(); throw new Error(e.detail); }
    const d = await r.json();
    hideLoading();
    renderResults(d.recommendations, 'Recomendações — Content-Based',
      `baseado em "${d.source}" · ${d.recommendations.length} filmes`);
  } catch(e) { hideLoading(); showError(e.message); }
}

async function runCollaborative() {
  const uid = document.getElementById('cf-uid').value;
  const n   = document.getElementById('cf-n').value;
  if (!uid) { showError('Digite um User ID.'); return; }

  showLoading();
  try {
    const r = await fetch(`${API}/recommend/collaborative?userId=${uid}&n=${n}`);
    if (!r.ok) { const e = await r.json(); throw new Error(e.detail); }
    const d = await r.json();
    hideLoading();
    renderResults(d.recommendations, 'Recomendações — Collaborative Filtering',
      `para usuário #${d.userId} · SVD · ${d.recommendations.length} filmes`);
  } catch(e) { hideLoading(); showError(e.message); }
}

async function runHybrid() {
  const title = document.getElementById('hy-title').value.trim();
  const uid   = document.getElementById('hy-uid').value;
  const n     = document.getElementById('hy-n').value;
  if (!title || !uid) { showError('Preencha o título e o User ID.'); return; }

  const searchTitle = cleanTitleForAPI(title);

  showLoading();
  try {
    const r = await fetch(`${API}/recommend/hybrid?title=${encodeURIComponent(searchTitle)}&userId=${uid}&n=${n}`);
    if (!r.ok) { const e = await r.json(); throw new Error(e.detail); }
    const d = await r.json();
    hideLoading();
    renderResults(d.recommendations, 'Recomendações — Hybrid',
      `baseado em "${d.source}" + usuário #${d.userId} · ${d.recommendations.length} filmes`);
  } catch(e) { hideLoading(); showError(e.message); }
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (currentMode === 'content')        runContent();
  else if (currentMode === 'collaborative') runCollaborative();
  else runHybrid();
});
</script>
</body>
</html>
